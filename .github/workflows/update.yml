name: Update frontier data

on:
  schedule:
    # Every three hours, at 17 minutes past. GitHub delays and sometimes
    # drops scheduled runs, most often at the top of the hour, and gaps of
    # more than 13 hours were seen under the old 00/06/12/18 schedule; the
    # off-peak minute and shorter interval keep the data fresh despite that.
    # A successful update redeploys the site (see the deploy job).
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update-frontier-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      decision_error: ${{ steps.refresh.outputs.decision_error }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data from Artificial Analysis
        id: refresh
        run: python -m llm_cost_frontier
        env:
          PYTHONPATH: src
      - name: Render advance cards
        run: |
          pip install matplotlib
          python -m llm_cost_frontier.render
        env:
          PYTHONPATH: src
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/decision-history.json build/llm-frontier.json build/feed*.xml build/images
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update frontier data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

  # Data commits above are made with the workflow token, which does not
  # trigger the push-driven deploy, so the deploy is called directly.
  deploy:
    needs: update
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # A failed scheduled run would otherwise just turn Actions red silently
  # while the dashboard goes stale. Failures open (or add to) a labeled
  # issue; the next success closes it.
  alert:
    needs: [update, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pipeline-failure --repo ${{ github.repository }} \
            --description "The scheduled update or deploy failed" --color d93f0b --force
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo ${{ github.repository }} --label pipeline-failure --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo ${{ github.repository }} --body "Another run failed: $url"
          else
            gh issue create --repo ${{ github.repository }} --label pipeline-failure \
              --title "Scheduled update failed" \
              --body "The scheduled update or its deploy failed: $url

          Until this is fixed the dashboard serves its last good data and shows a staleness note. Common causes: the source page's layout changed (fetch_payload found no data), or check_live_set refused a suspicious fetch (a shrunken live set or a mass index shift needs an era declared in data/eras.json). This issue closes automatically on the next successful run."
          fi

  # The Decision Index is read from a second page, and a failed or refused
  # read there does not fail the run, so the Decisions tab would go stale
  # unnoticed. The first such run opens one labeled issue, and the next good
  # read closes it.
  decision-alert:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DECISION_ERROR: ${{ needs.update.outputs.decision_error }}
        run: |
          repo="${{ github.repository }}"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create decision-index-stale --repo "$repo" \
            --description "The Decision Index fetch failed or was refused" --color d93f0b --force
          existing=$(gh issue list --repo "$repo" --label decision-index-stale --state open --json number -q '.[0].number')
          if [ -n "$DECISION_ERROR" ] && [ -z "$existing" ]; then
            gh issue create --repo "$repo" --label decision-index-stale \
              --title "Decision Index not updating" \
              --body "The scheduled update could not merge the Decision Index: $DECISION_ERROR

          Run: $url

          The rest of the dashboard updated normally; the Decisions tab serves its last good data until this is fixed. If Artificial Analysis recomposed the Decision Index (every contestant re-scored at once), declare the new version in data/decision-eras.json and the next run will merge it. This issue closes automatically on the next successful read."
          elif [ -z "$DECISION_ERROR" ] && [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$repo" --comment "Recovered: $url"
          fi

  recover:
    needs: [update, deploy]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for n in $(gh issue list --repo ${{ github.repository }} --label pipeline-failure --state open --json number -q '.[].number'); do
            gh issue close "$n" --repo ${{ github.repository }} --comment "Recovered: $url"
          done
